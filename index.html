<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekend Watch — Casino Roulette</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  min-height: 100vh;
  background: #6b0e0e;
  font-family: Georgia, 'Times New Roman', serif;
  color: #f5e6c8;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-bottom: 50px;
  overflow-x: hidden;
}

.felt {
  position: fixed; inset: 0; z-index: -1;
  background:
    radial-gradient(ellipse 70% 50% at 25% 30%, #8b1a1a 0%, transparent 55%),
    radial-gradient(ellipse 60% 70% at 75% 75%, #4a0a0a 0%, transparent 55%),
    radial-gradient(ellipse 80% 80% at 50% 50%, #7a1212 0%, transparent 80%),
    #6b0e0e;
}
.felt::after {
  content: '';
  position: fixed; inset: 0;
  background-image: repeating-linear-gradient(45deg,
    rgba(0,0,0,0.04) 0px, rgba(0,0,0,0.04) 1px,
    transparent 1px, transparent 4px);
}

/* ── Title ── */
.title-wrap { margin-top: 24px; text-align: center; }
.crown { font-size: 20px; color: #d4af37; letter-spacing: 18px; display: block; margin-bottom: 2px; }
.title { font-size: clamp(26px, 4.5vw, 44px); letter-spacing: 10px; color: #d4af37; text-transform: uppercase; font-weight: normal; text-shadow: 0 2px 12px rgba(180,130,20,0.3); }
.subtitle { font-size: 11px; letter-spacing: 5px; color: #c9a84c; margin-top: 6px; text-transform: uppercase; opacity: 0.8; }
.gold-divider { display: flex; align-items: center; gap: 12px; margin: 12px auto 0; width: 300px; }
.gold-divider::before { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, #c9a840); }
.gold-divider::after  { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, #c9a840, transparent); }
.gold-divider span { color: #d4af37; font-size: 14px; }

/* ── Layout ── */
.layout {
  display: flex; align-items: flex-start;
  gap: 32px; margin-top: 24px;
  padding: 0 20px; width: 100%; max-width: 1020px;
  justify-content: center; flex-wrap: wrap;
}

/* ── Wheel col ── */
.wheel-col { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
#wc {
  display: block; cursor: pointer; border-radius: 50%;
  box-shadow: 0 0 0 4px #c9a840, 0 0 0 8px #3d1f0a, 0 12px 50px rgba(0,0,0,0.7);
}
.chip-row { display: flex; gap: 8px; margin-top: 16px; }
.casino-chip {
  width: 40px; height: 40px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: bold; font-family: Arial, sans-serif;
  position: relative; box-shadow: 0 3px 8px rgba(0,0,0,0.5);
}
.casino-chip::before { content: ''; position: absolute; inset: 3px; border-radius: 50%; border: 1.5px dashed rgba(255,255,255,0.3); }
.spin-btn {
  margin-top: 18px; padding: 14px 52px;
  background: #c9a840; color: #1a0800;
  font-size: 16px; font-weight: bold; letter-spacing: 5px; text-transform: uppercase;
  border: none; border-radius: 3px; cursor: pointer; font-family: Georgia, serif;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.4);
  transition: transform 0.1s, background 0.15s;
}
.spin-btn:hover { background: #d4af37; }
.spin-btn:active { transform: scale(0.97); }
.spin-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

/* ── Side col ── */
.side-col { width: 280px; display: flex; flex-direction: column; gap: 12px; margin-top: 12px; flex-shrink: 0; }
.box { background: rgba(0,0,0,0.38); border: 1px solid rgba(201,168,64,0.28); border-radius: 6px; padding: 14px; backdrop-filter: blur(2px); }
.box-title { font-size: 10px; letter-spacing: 3.5px; color: #d4af37; text-transform: uppercase; margin-bottom: 10px; }

/* Genre / filter chips */
.chip-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn {
  padding: 5px 10px; border: 1px solid rgba(201,168,64,0.32);
  border-radius: 3px; font-size: 10px; letter-spacing: 1.5px;
  color: #c9a84c; background: transparent; cursor: pointer;
  font-family: Georgia, serif; text-transform: uppercase; transition: all 0.15s;
}
.chip-btn:hover { background: rgba(201,168,64,0.12); border-color: rgba(201,168,64,0.55); }
.chip-btn.sel { background: rgba(201,168,64,0.22); border-color: #d4af37; color: #f5e6c8; }

/* ── Loading state ── */
.loading-box { display: none; text-align: center; padding: 28px 14px; }
.loading-box.show { display: block; }
.spinner {
  width: 36px; height: 36px; border-radius: 50%;
  border: 3px solid rgba(201,168,64,0.2);
  border-top-color: #d4af37;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-genre { font-size: 10px; letter-spacing: 3px; color: #d4af37; text-transform: uppercase; }

/* ── Result card ── */
.result-box { display: none; animation: slideIn 0.4s ease; }
.result-box.show { display: block; }
@keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.r-genre {
  font-size: 9px; letter-spacing: 4px; color: #d4af37;
  text-transform: uppercase; margin-bottom: 8px;
  display: flex; align-items: center; gap: 8px;
}
.r-genre::before, .r-genre::after { content: '◆'; font-size: 7px; color: #c9a840; }

.r-content { display: flex; gap: 10px; margin-bottom: 10px; }
.r-poster {
  width: 80px; height: 120px; object-fit: cover;
  border-radius: 4px; flex-shrink: 0;
  border: 1px solid rgba(201,168,64,0.3);
  background: rgba(0,0,0,0.4);
}
.r-poster-ph {
  width: 80px; height: 120px; flex-shrink: 0;
  border-radius: 4px; border: 1px solid rgba(201,168,64,0.2);
  background: rgba(0,0,0,0.4);
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; color: rgba(201,168,64,0.3);
}
.r-info { flex: 1; min-width: 0; }
.r-title { font-size: 15px; color: #f5e6c8; margin-bottom: 6px; line-height: 1.3; }
.r-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
.badge {
  padding: 2px 8px; border-radius: 3px; font-size: 10px;
  font-weight: bold; letter-spacing: 1px; font-family: Arial, sans-serif;
}
.r-rating { font-size: 13px; color: #f5c518; margin-bottom: 4px; }
.r-year-lang { font-size: 11px; color: rgba(245,230,200,0.45); }

.r-overview {
  font-size: 12px; color: rgba(245,230,200,0.72); line-height: 1.6;
  margin-bottom: 10px;
}

/* Providers */
.r-providers-label { font-size: 9px; letter-spacing: 2.5px; color: rgba(201,168,64,0.6); text-transform: uppercase; margin-bottom: 7px; }
.providers-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.provider-item {
  display: flex; align-items: center; gap: 5px;
  padding: 4px 8px; border-radius: 4px;
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1);
  cursor: pointer; text-decoration: none; transition: background 0.15s;
}
.provider-item:hover { background: rgba(255,255,255,0.15); }
.provider-logo { width: 20px; height: 20px; border-radius: 4px; }
.provider-name { font-size: 10px; color: #f5e6c8; font-family: Arial, sans-serif; }
.no-provider { font-size: 11px; color: rgba(245,230,200,0.4); font-style: italic; }

/* Buttons */
.btn-row { display: flex; gap: 7px; margin-bottom: 10px; }
.r-btn {
  flex: 1; padding: 8px 6px; background: transparent;
  border: 1px solid rgba(201,168,64,0.35); color: #c9a84c;
  font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase;
  cursor: pointer; font-family: Georgia, serif; border-radius: 3px;
  transition: background 0.15s, color 0.15s; text-decoration: none; text-align: center;
}
.r-btn:hover { background: rgba(201,168,64,0.1); color: #f5e6c8; }
.r-btn.watch {
  background: rgba(201,168,64,0.2); border-color: #d4af37; color: #f5e6c8;
}
.r-btn.watch:hover { background: rgba(201,168,64,0.3); }

/* TMDB attribution */
.tmdb-attr {
  display: flex; align-items: center; gap: 7px;
  padding-top: 8px; border-top: 1px solid rgba(201,168,64,0.12);
  font-size: 9px; color: rgba(245,230,200,0.35); letter-spacing: 1px;
}
.tmdb-logo-wrap svg { height: 12px; width: auto; }

/* Error state */
.error-box { display: none; text-align: center; padding: 20px 14px; }
.error-box.show { display: block; }
.error-msg { font-size: 12px; color: rgba(245,230,200,0.55); line-height: 1.6; }

/* Confetti */
.confetti-piece { position: fixed; border-radius: 2px; pointer-events: none; animation: confettiFall linear forwards; z-index: 100; }
@keyframes confettiFall { 0% { transform: translateY(-20px) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }

/* ── Mobile ── */
@media (max-width: 820px) {
  .layout { flex-direction: column; align-items: center; gap: 20px; }
  .side-col { width: 100%; max-width: 480px; }
}

.wheel-visual { display: flex; flex-direction: column; align-items: center; }
.wheel-col { display: flex; flex-direction: column; align-items: center; gap: 0; }
</style>
</head>

<script>
/* ═══════════════════════════════════
   CONFIG
   ═══════════════════════════════════ */
const API_KEY  = 'de1460ca503ea646c276ecb91d0c4e1e';
const TMDB     = 'https://api.themoviedb.org/3';
const IMG_W500 = 'https://image.tmdb.org/t/p/w500';
const LOGO_W92 = 'https://image.tmdb.org/t/p/w92';

// CORS proxy — routes around file:// origin blocks
// Falls back through two proxy options then tries direct
const PROXIES = [
  u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
  u => `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`,
  u => u,
];

// TMDB genre IDs  { movie, tv }
const GENRE_IDS = {
  'ACTION':   { movie: '28',      tv: '10759' },
  'DRAMA':    { movie: '18',      tv: '18'    },
  'COMEDY':   { movie: '35',      tv: '35'    },
  'CRIME':    { movie: '80',      tv: '80'    },
  'THRILLER': { movie: '53',      tv: '9648'  },
  'SCI-FI':   { movie: '878',     tv: '10765' },
  'FANTASY':  { movie: '14',      tv: '10765' },
  'ROM-COM':    { movie: '35,10749', tv: '35,18' },
  'DOCU-FICTION':{ movie: '99',      tv: '99'   }, // Documentary
};

const GENRE_KEYS = Object.keys(GENRE_IDS);

const REGIONS = {
  'India':'IN','USA':'US','UK':'GB',
  'Germany':'DE','Australia':'AU','Japan':'JP','Canada':'CA',
};

/* ── State ── */
let selType   = 'BOTH';    // MOVIE | TV | BOTH
let selRegion = 'IN';
let lastFetchGenre = '';
let lastFetchType  = '';
let retryCount = 0;

/* ── Type buttons ── */
[['BOTH','Both'],['MOVIE','Movie'],['TV','TV Show']].forEach(([val, label]) => {
  const btn = document.createElement('button');
  btn.className = 'chip-btn' + (val === 'BOTH' ? ' sel' : '');
  btn.textContent = label;
  btn.onclick = () => {
    document.querySelectorAll('#typeGrid .chip-btn').forEach(b => b.classList.remove('sel'));
    btn.classList.add('sel');
    selType = val;
  };
  document.getElementById('typeGrid').appendChild(btn);
});

/* ── Region buttons ── */
Object.entries(REGIONS).forEach(([name, code]) => {
  const btn = document.createElement('button');
  btn.className = 'chip-btn' + (code === 'IN' ? ' sel' : '');
  btn.textContent = name;
  btn.onclick = () => {
    document.querySelectorAll('#regionGrid .chip-btn').forEach(b => b.classList.remove('sel'));
    btn.classList.add('sel');
    selRegion = code;
  };
  document.getElementById('regionGrid').appendChild(btn);
});

/* ═══════════════════════════════════
   WHEEL CANVAS
   ═══════════════════════════════════ */
const SEGMENTS = [
  { name: 'ACTION',   color: '#b22222' },
  { name: 'DRAMA',    color: '#111111' },
  { name: 'COMEDY',   color: '#b22222' },
  { name: 'ROM-COM',  color: '#8b1a8b' },
  { name: 'CRIME',    color: '#111111' },
  { name: 'THRILLER', color: '#b22222' },
  { name: 'SCI-FI',   color: '#111111' },
  { name: 'FANTASY',       color: '#b22222' },
  { name: 'DOCU-FICTION',  color: '#0a6b6b' },
];

const canvas = document.getElementById('wc');
const ctx    = canvas.getContext('2d');

// Responsive: set canvas size once; all drawing derives from canvas.width
function initCanvasSize() {
  const size = Math.min(window.innerWidth - 24, 430);
  canvas.width  = size;
  canvas.height = size;
}
initCanvasSize();
window.addEventListener('resize', () => { initCanvasSize(); drawWheel(); });

// All radii are fractions of R; R is derived per drawWheel call
const F = { outer:.970, gold:.960, track:.900, segOut:.860, segIn:.635,
            rotor:.615, hub1:.190, hub2:.130, hub3:.075, hub4:.035 };

const N       = SEGMENTS.length;
const SEG_ANG = (Math.PI * 2) / N;

let wheelAngle = 0;
let ballAngle  = -Math.PI / 2;
let ballFrac   = F.track;   // ball position as fraction of R
let spinning   = false;
let resultSeg  = -1;
let targetSeg  = 0;

let startWA, endWA, startBA, endBA, animStart;
const DUR = 5800;

function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }

function drawWheel() {
  const sz  = canvas.width;
  const CX  = sz / 2, CY = sz / 2;
  const R   = sz / 2 - sz * 0.035;        // slight inset so rim isn't clipped
  const ws  = sz / 430;                    // scale factor for fonts / dots / ball

  const rOuter  = R;
  const rGold   = R * F.gold;
  const rTrack  = R * F.track;
  const rSegOut = R * F.segOut;
  const rSegIn  = R * F.segIn;
  const rRotor  = R * F.rotor;
  const rHub1   = R * F.hub1;
  const rHub2   = R * F.hub2;
  const rHub3   = R * F.hub3;
  const rHub4   = R * F.hub4;

  ctx.clearRect(0, 0, sz, sz);

  // Outer shadow
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.7)'; ctx.shadowBlur = 28 * ws;
  ctx.beginPath(); ctx.arc(CX, CY, rOuter, 0, Math.PI*2);
  ctx.fillStyle = '#1e0a01'; ctx.fill();
  ctx.restore();

  // Mahogany body
  ctx.beginPath(); ctx.arc(CX, CY, rOuter, 0, Math.PI*2);
  ctx.fillStyle = '#2a1205'; ctx.fill();

  // Outer gold rim
  ctx.beginPath(); ctx.arc(CX, CY, rGold, 0, Math.PI*2);
  ctx.strokeStyle = '#c9a840'; ctx.lineWidth = 5 * ws; ctx.stroke();

  // Ball track groove
  ctx.beginPath(); ctx.arc(CX, CY, rTrack + 5*ws, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(180,130,30,0.25)'; ctx.lineWidth = 18 * ws; ctx.stroke();

  // Segment ring outer edge marker
  ctx.beginPath(); ctx.arc(CX, CY, rSegOut + 2*ws, 0, Math.PI*2);
  ctx.strokeStyle = '#a07820'; ctx.lineWidth = 2 * ws; ctx.stroke();

  /* ── Rotating segments ── */
  ctx.save();
  ctx.translate(CX, CY);
  ctx.rotate(wheelAngle);

  for (let i = 0; i < N; i++) {
    const a0  = i * SEG_ANG;
    const a1  = a0 + SEG_ANG;
    const mid = a0 + SEG_ANG / 2;
    const hi  = resultSeg === i && !spinning;

    ctx.beginPath();
    ctx.arc(0, 0, rSegOut, a0, a1);
    ctx.arc(0, 0, rSegIn,  a1, a0, true);
    ctx.closePath();
    ctx.fillStyle = hi ? '#d4af37' : SEGMENTS[i].color;
    ctx.fill();

    // Gold fret divider
    ctx.beginPath();
    ctx.moveTo(rSegIn  * Math.cos(a0), rSegIn  * Math.sin(a0));
    ctx.lineTo(rSegOut * Math.cos(a0), rSegOut * Math.sin(a0));
    ctx.strokeStyle = '#c9a840'; ctx.lineWidth = 2 * ws; ctx.stroke();

    // Pocket dot
    const dotR = (rSegOut + rTrack) / 2;
    ctx.beginPath();
    ctx.arc(Math.cos(a0)*dotR, Math.sin(a0)*dotR, 3*ws, 0, Math.PI*2);
    ctx.fillStyle = '#c9a840'; ctx.fill();

    // Segment label
    const textR = (rSegOut + rSegIn) / 2 + 2*ws;
    ctx.save();
    ctx.translate(Math.cos(mid)*textR, Math.sin(mid)*textR);
    ctx.rotate(mid + Math.PI/2);
    ctx.fillStyle    = hi ? '#1a0800' : '#fff';
    ctx.font         = `bold ${Math.max(8, Math.round(10*ws))}px Arial`;
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(SEGMENTS[i].name, 0, 0);
    ctx.restore();
  }

  ctx.beginPath(); ctx.arc(0,0,rSegOut,0,Math.PI*2);
  ctx.strokeStyle='#c9a840'; ctx.lineWidth=1.5*ws; ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,rSegIn,0,Math.PI*2);
  ctx.strokeStyle='#c9a840'; ctx.lineWidth=2*ws; ctx.stroke();
  ctx.restore();

  // Inner rotor
  ctx.beginPath(); ctx.arc(CX,CY,rRotor,0,Math.PI*2); ctx.fillStyle='#1c0c02'; ctx.fill();
  ctx.beginPath(); ctx.arc(CX,CY,rRotor,0,Math.PI*2); ctx.strokeStyle='#c9a840'; ctx.lineWidth=2*ws; ctx.stroke();

  // Rotor diamonds
  ctx.save();
  ctx.translate(CX, CY);
  ctx.rotate(wheelAngle * 0.4);
  for (let i = 0; i < 8; i++) {
    const a  = (i/8) * Math.PI * 2;
    const dr = rRotor * 0.68;
    ctx.save();
    ctx.translate(Math.cos(a)*dr, Math.sin(a)*dr);
    ctx.rotate(a);
    ctx.beginPath();
    ctx.moveTo(0,-6*ws); ctx.lineTo(4*ws,0); ctx.lineTo(0,6*ws); ctx.lineTo(-4*ws,0);
    ctx.closePath();
    ctx.fillStyle = '#c9a840'; ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  // Hub layers
  ctx.beginPath(); ctx.arc(CX,CY,rHub1,0,Math.PI*2); ctx.fillStyle='#c9a840'; ctx.fill();
  ctx.beginPath(); ctx.arc(CX,CY,rHub2,0,Math.PI*2); ctx.fillStyle='#7a5c0a'; ctx.fill();
  ctx.beginPath(); ctx.arc(CX,CY,rHub3,0,Math.PI*2); ctx.fillStyle='#d4af37'; ctx.fill();
  ctx.beginPath(); ctx.arc(CX,CY,rHub4,0,Math.PI*2); ctx.fillStyle='#1c0c02'; ctx.fill();

  // Ball — position = ballFrac * R
  const bRad = ballFrac * R;
  const bx   = CX + Math.cos(ballAngle) * bRad;
  const by   = CY + Math.sin(ballAngle) * bRad;
  const br   = 7 * ws;
  ctx.beginPath(); ctx.arc(bx+ws,by+2*ws,br,0,Math.PI*2); ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.fill();
  ctx.beginPath(); ctx.arc(bx,by,br,0,Math.PI*2); ctx.fillStyle='#f2f0ec'; ctx.fill();
  ctx.strokeStyle='#aaa'; ctx.lineWidth=0.8; ctx.stroke();
  ctx.beginPath(); ctx.arc(bx-2.5*ws,by-2.5*ws,3*ws,0,Math.PI*2); ctx.fillStyle='rgba(255,255,255,0.7)'; ctx.fill();
}

/* ═══════════════════════════════════
   SPIN
   ═══════════════════════════════════ */
function spin() {
  if (spinning) return;
  hideAll();
  resultSeg = -1;
  spinning  = true;
  document.getElementById('spinBtn').disabled = true;

  // Pure random spins — winning segment is determined by where the ball lands
  const wheelSpins = (5 + Math.random() * 4) * Math.PI * 2;
  const ballSpins  = (10 + Math.random() * 6) * Math.PI * 2;

  startWA = wheelAngle;  endWA = wheelAngle + wheelSpins;
  startBA = ballAngle;   endBA = ballAngle  - ballSpins;   // counter-clockwise
  animStart = null;      ballFrac = F.track;

  requestAnimationFrame(animFrame);
}

function animFrame(ts) {
  if (!animStart) animStart = ts;
  const t = Math.min((ts - animStart) / DUR, 1);
  const e = easeOutQuart(t);

  wheelAngle = startWA + (endWA - startWA) * e;
  ballAngle  = startBA + (endBA - startBA) * e;
  const fallT = Math.max(0, (t - 0.65) / 0.35);
  ballFrac = F.track - (F.track - F.segOut + 0.02) * fallT * fallT;

  drawWheel();

  if (t < 1) {
    requestAnimationFrame(animFrame);
  } else {
    wheelAngle = endWA; ballAngle = endBA; ballFrac = F.segOut - 0.02;
    spinning  = false;
    // Which segment did the ball land in?
    const relAngle = ((endBA - endWA) % (Math.PI*2) + Math.PI*2) % (Math.PI*2);
    targetSeg = Math.floor(relAngle / SEG_ANG) % N;
    resultSeg = targetSeg;
    drawWheel();
    document.getElementById('spinBtn').disabled = false;
    triggerFetch();
    launchConfetti();
  }
}

/* ═══════════════════════════════════
   TMDB FETCH
   ═══════════════════════════════════ */
async function triggerFetch() {
  const genreKey = SEGMENTS[targetSeg].name;

  lastFetchGenre = genreKey;

  // Determine media type
  let mediaType;
  if (selType === 'MOVIE')       mediaType = 'movie';
  else if (selType === 'TV')     mediaType = 'tv';
  else                           mediaType = Math.random() < 0.5 ? 'movie' : 'tv';

  lastFetchType = mediaType;
  retryCount = 0;
  showLoading(genreKey);
  await doFetch(genreKey, mediaType);
}

async function fetchAnother() {
  if (!lastFetchGenre) return;
  let mediaType = lastFetchType;
  if (selType === 'BOTH') mediaType = Math.random() < 0.5 ? 'movie' : 'tv';
  showLoading(lastFetchGenre);
  await doFetch(lastFetchGenre, mediaType);
}

async function retryFetch() {
  if (!lastFetchGenre) return;
  retryCount++;
  if (retryCount > 3) { showError('Too many retries. Please check your connection.'); return; }
  showLoading(lastFetchGenre);
  await doFetch(lastFetchGenre, lastFetchType || 'movie');
}

async function tmdbGet(path) {
  const sep     = path.includes('?') ? '&' : '?';
  const fullUrl = `${TMDB}${path}${sep}api_key=${API_KEY}`;
  let lastErr;

  for (const makeUrl of PROXIES) {
    const url = makeUrl(fullUrl);
    try {
      const res = await fetch(url);
      if (!res.ok) {
        let msg = `HTTP ${res.status}`;
        try { const j = await res.json(); msg = j.status_message || msg; } catch(_) {}
        throw new Error(msg);
      }
      const raw = await res.json();
      // allorigins wraps the response in {contents:"..."}
      return typeof raw.contents === 'string' ? JSON.parse(raw.contents) : raw;
    } catch(e) {
      lastErr = e;
      if (e.message !== 'Failed to fetch') throw e; // real API error — stop trying
      // otherwise try next proxy
    }
  }
  throw lastErr || new Error('Network unreachable');
}

async function doFetch(genreKey, mediaType) {
  try {
    const gids = GENRE_IDS[genreKey];
    const gid  = gids ? gids[mediaType] : null;
    const page = Math.floor(Math.random() * 8) + 1;

    // Step 1: discover by genre only — no region filter so we always get a full pool
    let path = `/discover/${mediaType}?sort_by=popularity.desc&page=${page}&include_adult=false&language=en-US`;
    if (gid) path += `&with_genres=${gid}`;

    const data    = await tmdbGet(path);
    const results = (data.results || []).filter(r => r.overview && r.overview.length > 20);
    if (results.length === 0) throw new Error('No results for this genre');

    // Step 2: shuffle pool, then walk up to 5 candidates looking for one
    //         that has flatrate streaming in the user's selected region.
    const shuffled = [...results].sort(() => Math.random() - 0.5);
    const candidates = shuffled.slice(0, 5);

    let chosen    = candidates[0];
    let providers = [];
    let watchLink = `https://www.themoviedb.org/${mediaType}/${chosen.id}`;
    let regionFound = false;

    for (const candidate of candidates) {
      try {
        const provData = await tmdbGet(`/${mediaType}/${candidate.id}/watch/providers`);
        const reg      = provData.results?.[selRegion] || {};
        const prov     = reg.flatrate || reg.rent || reg.buy || [];
        if (prov.length > 0) {
          chosen      = candidate;
          providers   = prov;
          watchLink   = reg.link || watchLink;
          regionFound = true;
          break;
        }
      } catch(_) { /* keep trying */ }
    }

    // Step 3: if nothing matched the region, still show the first candidate
    //         but fetch its providers anyway (any region) as fallback display
    if (!regionFound) {
      try {
        const provData = await tmdbGet(`/${mediaType}/${chosen.id}/watch/providers`);
        const reg      = provData.results?.[selRegion] || {};
        providers = reg.flatrate || reg.rent || reg.buy || [];
        watchLink = reg.link || watchLink;
      } catch(_) {}
    }

    renderResult({
      title:       item(chosen, 'title'),
      year:        (chosen.release_date || chosen.first_air_date || '').slice(0, 4),
      poster:      chosen.poster_path ? IMG_W500 + chosen.poster_path : null,
      rating:      chosen.vote_average ? chosen.vote_average.toFixed(1) : null,
      votes:       chosen.vote_count   ? chosen.vote_count.toLocaleString() : '',
      overview:    chosen.overview || '',
      typeLabel:   mediaType === 'movie' ? 'Movie' : 'TV Show',
      regionFound, providers, watchLink, genreKey,
    });

  } catch (err) {
    console.error('[TMDB]', err);
    showError(`<b>Error:</b> ${err.message}<br><br>
      <small style="opacity:.6">Key: ${API_KEY.slice(0,8)}…&nbsp;|&nbsp;${TMDB}</small><br><br>
      Try spinning again.`);
  }
}

// helper — title for movie vs tv
function item(r, field) {
  if (field === 'title') return r.title || r.name || 'Untitled';
  return r[field];
}

/* ═══════════════════════════════════
   RENDER
   ═══════════════════════════════════ */
function renderResult({ title, year, poster, rating, votes, overview, typeLabel, providers, watchLink, genreKey, regionFound }) {
  hideAll();

  document.getElementById('rGenre').textContent = genreKey;

  // Poster
  const imgEl = document.getElementById('rPoster');
  const phEl  = document.getElementById('rPosterPh');
  if (poster) {
    imgEl.src = poster;
    imgEl.style.display = 'block';
    phEl.style.display  = 'none';
  } else {
    imgEl.style.display = 'none';
    phEl.style.display  = 'flex';
  }

  document.getElementById('rTitle').textContent = title;

  // Badges
  const badgesEl = document.getElementById('rBadges');
  badgesEl.innerHTML = '';
  const typeBadge = document.createElement('span');
  typeBadge.className = 'badge';
  typeBadge.textContent = typeLabel;
  typeBadge.style.cssText = 'background:rgba(201,168,64,0.18);color:#d4af37;border:1px solid rgba(201,168,64,0.3);';
  badgesEl.appendChild(typeBadge);

  document.getElementById('rRating').textContent = rating ? `★ ${rating}  (${votes} votes)` : '';
  document.getElementById('rYearLang').textContent = year || '';
  document.getElementById('rOverview').textContent = overview;

  // Region label — show a warning if nothing streamed in the region
  const regionName = Object.entries(REGIONS).find(([,c]) => c === selRegion)?.[0] || selRegion;
  const regionLabelEl = document.getElementById('rRegionLabel');
  regionLabelEl.textContent = regionName;
  regionLabelEl.style.color = regionFound === false ? 'rgba(255,140,100,0.8)' : '';

  // Providers
  const provRow = document.getElementById('providersRow');
  provRow.innerHTML = '';
  if (providers.length === 0) {
    provRow.innerHTML = '<span class="no-provider">Not available for streaming in this region</span>';
  } else {
    providers.slice(0, 6).forEach(p => {
      const a = document.createElement('a');
      a.className = 'provider-item';
      a.href = watchLink;
      a.target = '_blank';
      a.title = p.provider_name;
      if (p.logo_path) {
        const logo = document.createElement('img');
        logo.className = 'provider-logo';
        logo.src = LOGO_W92 + p.logo_path;
        logo.alt = p.provider_name;
        a.appendChild(logo);
      }
      const name = document.createElement('span');
      name.className = 'provider-name';
      name.textContent = p.provider_name;
      a.appendChild(name);
      provRow.appendChild(a);
    });
  }

  // Watch Now button
  document.getElementById('watchBtn').href = watchLink;

  document.getElementById('resultBox').classList.add('show');
}

/* ── UI state helpers ── */
function hideAll() {
  document.getElementById('loadingBox').classList.remove('show');
  document.getElementById('resultBox').classList.remove('show');
  document.getElementById('errorBox').classList.remove('show');
}

function showLoading(genreKey) {
  hideAll();
  document.getElementById('loadingGenre').textContent = `Finding ${genreKey} picks…`;
  document.getElementById('loadingBox').classList.add('show');
}

function showError(msg) {
  hideAll();
  document.getElementById('errorMsg').innerHTML = msg;
  document.getElementById('errorBox').classList.add('show');
}

/* ── Confetti ── */
function launchConfetti() {
  const colors = ['#d4af37','#c41e3a','#1b5e20','#1565c0','#f5e6c8','#fff'];
  for (let i = 0; i < 48; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.cssText = `left:${Math.random()*100}vw;top:-20px;background:${colors[i%colors.length]};width:${6+Math.random()*8}px;height:${8+Math.random()*12}px;animation-duration:${1.5+Math.random()*2}s;`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }, i * 30);
  }
}

/* ── API health check on load ── */
(async () => {
  const indicator = document.createElement('div');
  indicator.style.cssText = 'font-size:10px;letter-spacing:2px;text-align:center;margin-top:8px;color:rgba(201,168,64,0.5);';
  indicator.textContent = '● Checking TMDB connection…';
  document.querySelector('.side-col').appendChild(indicator);

  try {
    const cfg = await tmdbGet(`/configuration`);
    if (cfg.images) {
      indicator.style.color = 'rgba(100,200,100,0.7)';
      indicator.textContent = '● TMDB connected — spin the wheel!';
    } else {
      throw new Error('Unexpected response');
    }
  } catch (e) {
    indicator.style.color = 'rgba(255,100,100,0.8)';
    indicator.textContent = `● TMDB error: ${e.message}`;
  }

  setTimeout(() => indicator.remove(), 8000);
})();


/* ── Init ── */
drawWheel();
</script>
