<head>

<title>Weekend Watch — Casino Roulette</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  min-height: 100vh;
  background: #6b0e0e;
  font-family: Georgia, 'Times New Roman', serif;
  color: #f5e6c8;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-bottom: 50px;
  overflow-x: hidden;
}

.felt {
  position: fixed; inset: 0; z-index: -1;
  background:
    radial-gradient(ellipse 70% 50% at 25% 30%, #8b1a1a 0%, transparent 55%),
    radial-gradient(ellipse 60% 70% at 75% 75%, #4a0a0a 0%, transparent 55%),
    radial-gradient(ellipse 80% 80% at 50% 50%, #7a1212 0%, transparent 80%),
    #6b0e0e;
}
.felt::after {
  content: '';
  position: fixed; inset: 0;
  background-image: repeating-linear-gradient(45deg,
    rgba(0,0,0,0.04) 0px, rgba(0,0,0,0.04) 1px,
    transparent 1px, transparent 4px);
}

/* ── Title ── */
.title-wrap { margin-top: 26px; text-align: center; }
.crown { font-size: 20px; color: #d4af37; letter-spacing: 18px; display: block; margin-bottom: 2px; }
.title {
  font-size: clamp(26px, 4.5vw, 44px);
  letter-spacing: 10px; color: #d4af37;
  text-transform: uppercase; font-weight: normal;
  text-shadow: 0 2px 12px rgba(180,130,20,0.3);
}
.subtitle { font-size: 11px; letter-spacing: 5px; color: #c9a84c; margin-top: 6px; text-transform: uppercase; opacity: 0.8; }
.gold-divider {
  display: flex; align-items: center; gap: 12px;
  margin: 12px auto 0; width: 300px;
}
.gold-divider::before { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, #c9a840); }
.gold-divider::after  { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, #c9a840, transparent); }
.gold-divider span { color: #d4af37; font-size: 14px; }

/* ── Layout ── */
.layout {
  display: flex; align-items: flex-start;
  gap: 32px; margin-top: 24px;
  padding: 0 20px; width: 100%; max-width: 1000px;
  justify-content: center; flex-wrap: wrap;
}

/* ── Wheel ── */
.wheel-col { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
.pointer-wrap {
  width: 0; height: 0;
  border-left: 12px solid transparent;
  border-right: 12px solid transparent;
  border-top: 22px solid #d4af37;
  margin-bottom: -11px; z-index: 10;
  filter: drop-shadow(0 3px 6px rgba(0,0,0,0.7));
}
#wc {
  display: block; cursor: pointer; border-radius: 50%;
  box-shadow:
    0 0 0 4px #c9a840,
    0 0 0 8px #3d1f0a,
    0 12px 50px rgba(0,0,0,0.7),
    0 4px 20px rgba(0,0,0,0.5);
}
.chip-row { display: flex; gap: 8px; margin-top: 16px; }
.casino-chip {
  width: 40px; height: 40px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: bold; font-family: Arial, sans-serif;
  position: relative; box-shadow: 0 3px 8px rgba(0,0,0,0.5);
}
.casino-chip::before {
  content: ''; position: absolute; inset: 3px;
  border-radius: 50%; border: 1.5px dashed rgba(255,255,255,0.3);
}
.spin-btn {
  margin-top: 18px; padding: 14px 52px;
  background: #c9a840; color: #1a0800;
  font-size: 16px; font-weight: bold;
  letter-spacing: 5px; text-transform: uppercase;
  border: none; border-radius: 3px; cursor: pointer;
  font-family: Georgia, serif;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.4);
  transition: transform 0.1s, background 0.15s;
}
.spin-btn:hover { background: #d4af37; }
.spin-btn:active { transform: scale(0.97); }
.spin-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

/* ── Side panel ── */
.side-col { width: 262px; display: flex; flex-direction: column; gap: 12px; margin-top: 12px; flex-shrink: 0; }
.box {
  background: rgba(0,0,0,0.38); border: 1px solid rgba(201,168,64,0.28);
  border-radius: 6px; padding: 14px; backdrop-filter: blur(2px);
}
.box-title { font-size: 10px; letter-spacing: 3.5px; color: #d4af37; text-transform: uppercase; margin-bottom: 10px; }

/* Genre chips */
.genre-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.genre-btn {
  padding: 5px 10px; border: 1px solid rgba(201,168,64,0.32);
  border-radius: 3px; font-size: 10px; letter-spacing: 1.5px;
  color: #c9a84c; background: transparent;
  cursor: pointer; font-family: Georgia, serif;
  text-transform: uppercase; transition: all 0.15s;
}
.genre-btn:hover { background: rgba(201,168,64,0.12); border-color: rgba(201,168,64,0.55); }
.genre-btn.sel { background: rgba(201,168,64,0.22); border-color: #d4af37; color: #f5e6c8; }

/* Filter rows */
.filter-row { display: flex; flex-wrap: wrap; gap: 6px; }
.filter-btn {
  padding: 4px 9px; border: 1px solid rgba(201,168,64,0.25);
  border-radius: 3px; font-size: 9px; letter-spacing: 1px;
  color: rgba(201,168,64,0.65); background: transparent;
  cursor: pointer; font-family: Arial, sans-serif;
  text-transform: uppercase; transition: all 0.15s;
}
.filter-btn:hover { background: rgba(201,168,64,0.08); }
.filter-btn.sel { background: rgba(201,168,64,0.18); border-color: #c9a840; color: #f5e6c8; }

/* Stats bar */
.stats-bar {
  font-size: 10px; color: rgba(201,168,64,0.5);
  letter-spacing: 1px; text-align: center;
  padding: 6px 0 0;
}

/* Result card */
.result-box { display: none; animation: slideIn 0.4s ease; }
.result-box.show { display: block; }
@keyframes slideIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.r-genre {
  font-size: 9px; letter-spacing: 4px; color: #d4af37;
  text-transform: uppercase; margin-bottom: 6px;
  display: flex; align-items: center; gap: 8px;
}
.r-genre::before, .r-genre::after { content: '◆'; font-size: 7px; color: #c9a840; }
.r-title { font-size: 18px; color: #f5e6c8; margin-bottom: 8px; line-height: 1.3; }
.r-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
.ott {
  padding: 3px 9px; border-radius: 3px;
  font-size: 10px; font-weight: bold; letter-spacing: 1px;
  text-transform: uppercase; font-family: Arial, sans-serif;
}
.type-badge {
  padding: 3px 9px; border-radius: 3px; font-size: 10px;
  letter-spacing: 1px; text-transform: uppercase;
  font-family: Arial, sans-serif; background: rgba(201,168,64,0.18);
  color: #d4af37; border: 1px solid rgba(201,168,64,0.3);
}
.imdb { font-size: 13px; color: #f5c518; letter-spacing: 0.5px; }
.r-sub {
  font-size: 11px; color: rgba(245,230,200,0.45);
  margin-bottom: 10px; letter-spacing: 0.5px;
}
.r-desc { font-size: 12.5px; color: rgba(245,230,200,0.75); line-height: 1.65; margin-bottom: 12px; }
.btn-row { display: flex; gap: 8px; }
.r-btn {
  flex: 1; padding: 8px 10px; background: transparent;
  border: 1px solid rgba(201,168,64,0.35); color: #c9a84c;
  font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
  cursor: pointer; font-family: Georgia, serif; border-radius: 3px;
  transition: background 0.15s, color 0.15s;
}
.r-btn:hover { background: rgba(201,168,64,0.1); color: #f5e6c8; }

/* Confetti */
.confetti-piece {
  position: fixed; width: 8px; height: 12px; border-radius: 2px;
  pointer-events: none; animation: confettiFall linear forwards; z-index: 100;
}
@keyframes confettiFall {
  0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

@media (max-width: 760px) {
  .layout { flex-direction: column; align-items: center; }
  .side-col { width: 100%; max-width: 430px; }
}

function makeFilterBtns(containerId, values, current, setter) {
  const el = document.getElementById(containerId);
  values.forEach(v => {

    btn.className = 'filter-btn' + (v === current ? ' sel' : '');

function getPool(genreKey) {
  const movies = MOVIES[genreKey] || [];
  return movies.filter(m => {

    if (selectedType     !== 'ALL' && m.type !== selectedType)     return false;
    if (selectedCountry  !== 'ALL' && m.country !== selectedCountry) return false;
    return true;
  });
}

function updateStats() {

  const total = Object.values(MOVIES).reduce((a,b) => a + b.length, 0) - MOVIES.SURPRISE.length;
  document.getElementById('statsBar').textContent =
    `${count} title${count !== 1 ? 's' : ''} match · ${total} total in library`;
}

/* ─── Canvas ─── */
const canvas = document.getElementById('wc');
const ctx    = canvas.getContext('2d');
const CX = 215, CY = 215, R = 200;

const rOuter  = R;
const rGold   = R * 0.970;
const rTrack  = R * 0.900;
const rSegOut = R * 0.860;
const rSegIn  = R * 0.635;
const rRotor  = R * 0.615;
const rHub1   = R * 0.190;
const rHub2   = R * 0.130;
const rHub3   = R * 0.075;
const rHub4   = R * 0.035;

const N       = SEGMENTS.length;
const SEG_ANG = (Math.PI * 2) / N;

let wheelAngle = 0;
let ballAngle  = -Math.PI / 2;
let ballRad    = rTrack;
let spinning   = false;
let resultSeg  = -1;
let startWA, endWA, startBA, endBA, startTime;
const DUR = 5800;
let targetSeg = 0;
let currentMovieIdx = 0;
let lastGenreKey    = '';

function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }

function drawWheel() {
  ctx.clearRect(0, 0, 430, 430);

  // Shadow
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.7)';
  ctx.shadowBlur  = 28;
  ctx.beginPath(); ctx.arc(CX, CY, rOuter, 0, Math.PI*2);
  ctx.fillStyle = '#1e0a01'; ctx.fill();
  ctx.restore();

  // Mahogany body
  ctx.beginPath(); ctx.arc(CX, CY, rOuter, 0, Math.PI*2);
  ctx.fillStyle = '#2a1205'; ctx.fill();

  // Outer gold rim
  ctx.beginPath(); ctx.arc(CX, CY, rGold, 0, Math.PI*2);
  ctx.strokeStyle = '#c9a840'; ctx.lineWidth = 5; ctx.stroke();

  // Ball track groove
  ctx.beginPath(); ctx.arc(CX, CY, rTrack+5, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(180,130,30,0.25)'; ctx.lineWidth = 18; ctx.stroke();

  // Segment ring outer edge
  ctx.beginPath(); ctx.arc(CX, CY, rSegOut+2, 0, Math.PI*2);
  ctx.strokeStyle = '#a07820'; ctx.lineWidth = 2; ctx.stroke();

  /* Rotating part */
  ctx.save();
  ctx.translate(CX, CY);
  ctx.rotate(wheelAngle);

  for (let i = 0; i < N; i++) {
    const a0  = i * SEG_ANG;
    const a1  = a0 + SEG_ANG;
    const mid = a0 + SEG_ANG / 2;
    const hi  = resultSeg === i && !spinning;

    // Fill
    ctx.beginPath();
    ctx.arc(0, 0, rSegOut, a0, a1);
    ctx.arc(0, 0, rSegIn,  a1, a0, true);
    ctx.closePath();
    ctx.fillStyle = hi ? '#d4af37' : SEGMENTS[i].color;
    ctx.fill();

    // Fret divider
    ctx.beginPath();
    ctx.moveTo(rSegIn  * Math.cos(a0), rSegIn  * Math.sin(a0));
    ctx.lineTo(rSegOut * Math.cos(a0), rSegOut * Math.sin(a0));
    ctx.strokeStyle = '#c9a840'; ctx.lineWidth = 2; ctx.stroke();

    // Pocket dot
    const dotR = (rSegOut + rTrack) / 2;
    ctx.beginPath();
    ctx.arc(Math.cos(a0)*dotR, Math.sin(a0)*dotR, 3, 0, Math.PI*2);
    ctx.fillStyle = '#c9a840'; ctx.fill();

    // Label
    const textR = (rSegOut + rSegIn) / 2 + 2;
    ctx.save();
    ctx.translate(Math.cos(mid)*textR, Math.sin(mid)*textR);
    ctx.rotate(mid + Math.PI/2);
    ctx.fillStyle    = hi ? '#1a0800' : '#fff';
    ctx.font         = 'bold 10px Arial';
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(SEGMENTS[i].name, 0, 0);
    ctx.restore();
  }

  // Ring borders
  ctx.beginPath(); ctx.arc(0,0,rSegOut,0,Math.PI*2);
  ctx.strokeStyle='#c9a840'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,rSegIn,0,Math.PI*2);
  ctx.strokeStyle='#c9a840'; ctx.lineWidth=2; ctx.stroke();
  ctx.restore();

  // Inner rotor
  ctx.beginPath(); ctx.arc(CX,CY,rRotor,0,Math.PI*2);
  ctx.fillStyle='#1c0c02'; ctx.fill();
  ctx.beginPath(); ctx.arc(CX,CY,rRotor,0,Math.PI*2);
  ctx.strokeStyle='#c9a840'; ctx.lineWidth=2; ctx.stroke();

  // Diamonds
  ctx.save();
  ctx.translate(CX,CY);
  ctx.rotate(wheelAngle*0.4);
  for (let i=0;i<8;i++){
    const a = (i/8)*Math.PI*2;
    const dr = rRotor*0.68;
    ctx.save();
    ctx.translate(Math.cos(a)*dr, Math.sin(a)*dr);
    ctx.rotate(a);
    ctx.beginPath();
    ctx.moveTo(0,-6); ctx.lineTo(4,0); ctx.lineTo(0,6); ctx.lineTo(-4,0);
    ctx.closePath();
    ctx.fillStyle='#c9a840'; ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  // Hub
  ctx.beginPath(); ctx.arc(CX,CY,rHub1,0,Math.PI*2); ctx.fillStyle='#c9a840'; ctx.fill();
  ctx.beginPath(); ctx.arc(CX,CY,rHub2,0,Math.PI*2); ctx.fillStyle='#7a5c0a'; ctx.fill();
  ctx.beginPath(); ctx.arc(CX,CY,rHub3,0,Math.PI*2); ctx.fillStyle='#d4af37'; ctx.fill();
  ctx.beginPath(); ctx.arc(CX,CY,rHub4,0,Math.PI*2); ctx.fillStyle='#1c0c02'; ctx.fill();

  // Ball
  const bx = CX + Math.cos(ballAngle)*ballRad;
  const by = CY + Math.sin(ballAngle)*ballRad;
  ctx.beginPath(); ctx.arc(bx+1,by+2,7,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.fill();
  ctx.beginPath(); ctx.arc(bx,by,7,0,Math.PI*2);
  ctx.fillStyle='#f2f0ec'; ctx.fill();
  ctx.strokeStyle='#aaa'; ctx.lineWidth=0.8; ctx.stroke();
  ctx.beginPath(); ctx.arc(bx-2.5,by-2.5,3,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.7)'; ctx.fill();
}

/* ─── Spin ─── */
function spin() {
  if (spinning) return;
  document.getElementById('resultBox').classList.remove('show');
  resultSeg = -1; spinning = true;
  document.getElementById('spinBtn').disabled = true;

  // Pick target segment
  if (selectedGenre === 'RANDOM') {
    targetSeg = Math.floor(Math.random() * N);
  } else {
    const idx = SEGMENTS.findIndex(s => s.name === selectedGenre);
    targetSeg = idx >= 0 ? idx : Math.floor(Math.random() * N);
  }

  const segMid = targetSeg * SEG_ANG + SEG_ANG / 2;
  const desired = -Math.PI/2 - segMid + (Math.random()-0.5)*SEG_ANG*0.55;
  const extra   = (5 + Math.floor(Math.random()*4)) * Math.PI * 2;
  const delta   = ((desired - wheelAngle) % (Math.PI*2) + Math.PI*2) % (Math.PI*2);

  startWA = wheelAngle; endWA = wheelAngle + extra + delta;
  startBA = ballAngle;  endBA = ballAngle  - (10 + Math.random()*6) * Math.PI * 2;
  startTime = null; ballRad = rTrack;

  requestAnimationFrame(animFrame);
}

function animFrame(ts) {
  if (!startTime) startTime = ts;
  const t = Math.min((ts - startTime) / DUR, 1);
  const e = easeOutQuart(t);

  wheelAngle = startWA + (endWA - startWA) * e;
  ballAngle  = startBA + (endBA - startBA) * e;

  const fallT = Math.max(0, (t - 0.65) / 0.35);
  ballRad = rTrack - (rTrack - rSegOut + 10) * fallT * fallT;

  drawWheel();

  if (t < 1) {
    requestAnimationFrame(animFrame);
  } else {
    wheelAngle = endWA; ballAngle = endBA; ballRad = rSegOut - 8;
    spinning = false; resultSeg = targetSeg;
    drawWheel();
    showResult();
    document.getElementById('spinBtn').disabled = false;
    launchConfetti();
  }
}

/* ─── Result ─── */
function showResult() {
  const seg      = SEGMENTS[targetSeg];
  const genreKey = seg.name === 'SURPRISE' ? 'SURPRISE' : seg.name;
  lastGenreKey   = genreKey;
  const pool     = getPool(genreKey);
  if (!pool.length) {
    lastGenreKey = '';
    document.getElementById('resultBox').classList.remove('show');
    document.getElementById('statsBar').textContent =
      'No titles match your filters — try broadening them';
    return;
  }
  currentMovieIdx = Math.floor(Math.random() * pool.length);
  renderMovie(pool[currentMovieIdx]);
}

function nextMovie() {
  if (!lastGenreKey) return;
  const pool = getPool(lastGenreKey);
  if (!pool.length) return;
  currentMovieIdx = (currentMovieIdx + 1) % pool.length;
  renderMovie(pool[currentMovieIdx]);
}

function fmtDur(mins) {
  if (mins >= 60) {
    const h = Math.floor(mins/60), m = mins % 60;
    return m ? `${h}h ${m}m` : `${h}h`;
  }
  return `${mins}m`;
}

function renderMovie(m) {
  const displayGenre = m._genre || lastGenreKey;
  document.getElementById('rGenre').textContent = displayGenre;
  document.getElementById('rTitle').textContent = m.title;

  const ottUrl = (OTT_LINKS[m.ott] || 'https://www.google.com/search?q=') + encodeURIComponent(m.title);
  const ottEl  = document.getElementById('rOtt');
  ottEl.textContent            = m.ott + ' ↗';
  ottEl.style.background       = OTT_COLORS[m.ott] || '#555';
  ottEl.style.color            = '#fff';
  ottEl.style.cursor           = 'pointer';
  ottEl.style.textDecoration   = 'none';
  ottEl.onclick                = () => window.open(ottUrl, '_blank');

  const watchBtn = document.getElementById('watchBtn');
  watchBtn.href             = ottUrl;
  watchBtn.style.color      = '#c9a84c';
  watchBtn.style.borderColor = 'rgba(201,168,64,0.35)';

  document.getElementById('rType').textContent = m.type;
  document.getElementById('rImdb').textContent = '★ ' + m.rating.toFixed(1);
  document.getElementById('rSub').textContent  =
    `${m.country} · ${m.lang} · ${m.year} · ${fmtDur(m.dur)} · ${m.votes.toLocaleString()} votes`;
  document.getElementById('rDesc').textContent = m.desc;
  document.getElementById('resultBox').classList.add('show');
}

/* ─── Confetti ─── */
function launchConfetti() {
  const colors = ['#d4af37','#c41e3a','#1b5e20','#1565c0','#f5e6c8','#fff'];
  for (let i=0;i<48;i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.left = Math.random()*100 + 'vw';
      el.style.top  = '-20px';
      el.style.background = colors[Math.floor(Math.random()*colors.length)];
      el.style.width  = (6+Math.random()*8) + 'px';
      el.style.height = (8+Math.random()*12) + 'px';
      el.style.animationDuration = (1.5+Math.random()*2) + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }, i*30);
  }
}

drawWheel();
</script>
</body>
</html>
